<!doctype html><meta charset="utf-8"><base href="/"><title>Smart Scan – Testseite</title>
<!-- Testseite: lädt NUR Smart Scan (frontend/smart-scan) mit React und der selbst gehosteten Texterkennung.
     Kein Firebase, kein Backend, keine Kundendaten. Wird von tests/e2e/*.test.mjs verwendet. -->
<link rel="stylesheet" href="/vendor/tailwind/tailwind.css">
<link rel="stylesheet" href="/frontend/styles/smart-scan.css">
<script>
  // Testschalter: ?neural=0 → nur Tesseract; ?fake=1 → Attrappe für Tesseract (Texte aus window.__ocr)
  var q = new URLSearchParams(location.search);
  window.PS_SMART_SCAN_OVERRIDE = { neural: q.get('neural') === '1' };
  if (q.get('fake') === '1') {
    window.__ocr = { text: '', delay: 0, hang: false, calls: 0, created: 0, terminated: 0 };
    window.Tesseract = {
      createWorker: async function () {
        window.__ocr.created++;
        return {
          setParameters: async function () {},
          recognize: function () {
            var o = window.__ocr; o.calls++;
            var spec = { text: o.text, delay: o.delay, hang: o.hang };
            if (spec.hang) return new Promise(function () {});
            return new Promise(function (r) { setTimeout(function () { r({ data: { text: spec.text || '', blocks: [] } }); }, spec.delay || 0); });
          },
          terminate: async function () { window.__ocr.terminated++; }
        };
      }
    };
  }
</script>
<script src="/vendor/react/react.production.min.js"></script>
<script src="/vendor/react/react-dom.production.min.js"></script>
<script src="/frontend/core/vendor-paths.js"></script>
<script>
function psPortLoadScript(src) {
  return new Promise(function (res, rej) {
    if (window.Tesseract && /tesseract/.test(src)) return res();
    var s = document.createElement('script'); s.src = src; s.onload = function () { res(); }; s.onerror = rej; document.head.appendChild(s);
  });
}
</script>
