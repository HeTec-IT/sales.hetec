# Veröffentlichung auf Azure Static Web Apps (App + Funktionen unter /api).
# Einmalig nötig: GitHub-Secret AZURE_STATIC_WEB_APPS_API_TOKEN (siehe docs/AZURE-EINRICHTUNG.md).
name: Azure Static Web App

on:
  push:
    branches: [main, azure-migration]
  workflow_dispatch:

concurrency:
  group: swa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Funktionen testen (Rechte, Datenzugriff)
        working-directory: api
        run: |
          npm ci
          npm test

      - name: Nur die Dateien der App zusammenstellen (ohne api/, scripts/, .github/)
        run: |
          mkdir -p dist
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png ps-config.js ps-backend.js dist/
          cp -r vendor dist/vendor
          cp ./*.json dist/
          test -f dist/staticwebapp.config.json

      - name: Auf Azure veröffentlichen
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          skip_app_build: true
          production_branch: main
