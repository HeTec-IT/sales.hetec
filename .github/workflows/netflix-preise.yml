name: Netflix-Preise aktualisieren

on:
  schedule:
    - cron: '20 11 * * *'   # 12:20 Uhr (Winterzeit), in der Sommerzeit 13:20 Uhr
  workflow_dispatch:
  push:
    paths:
      - 'scripts/netflix-preise.mjs'
      - '.github/workflows/netflix-preise.yml'

permissions:
  contents: write

concurrency:
  group: netflix-preise
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Netflix-Preise lesen
        run: node scripts/netflix-preise.mjs
      - name: Speichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add netflix-preise.json
          git diff --cached --quiet || (git commit -m "Netflix-Preise aktualisiert" && git pull --rebase && git push)
