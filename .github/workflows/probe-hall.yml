name: Probe Hall-Deploy (temporär)
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe-hall.mjs'
      - '.github/workflows/probe-hall.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node scripts/probe-hall.mjs
