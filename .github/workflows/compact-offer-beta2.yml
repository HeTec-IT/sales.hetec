name: Apply compact offer editor beta 2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-offer-beta2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply and test targeted editor patch
        run: |
          node <<'PATCH'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const assert = require('node:assert/strict');
          const path = 'index.html';
          const orig = fs.readFileSync(path,'utf8');
          if (orig.includes("window.APP_VERSION = '56.0-beta.2';")) process.exit(0);
          const nl = orig.includes('\r\n') ? '\r\n' : '\n';
          let s = orig.replace(/\r\n/g,'\n');
          function once(a,b){ assert.equal(s.split(a).length,2,'Anchor not unique: '+a.slice(0,100)); s=s.replace(a,()=>b); }
          once("window.APP_VERSION = '56.0-beta.1';","window.APP_VERSION = '56.0-beta.2';");
          once("return h('div', { key: key + i, className: 'mt-2' },","return h('div', { key: key + i, className: 'mt-2 rounded-xl border border-slate-200 bg-slate-50 p-2' },");
          once("h('button', { onClick: () => setItemG(key, idxs, 'ak', !it.ak), className: 'px-3 py-1.5 rounded-full text-xs font-black border '","h('button', { onClick: () => setItemG(key, idxs, 'ak', !it.ak), 'aria-pressed': !!it.ak, className: 'px-3 py-2 rounded-lg text-xs font-black border '");
          once("    it.art ? h('div', { className: 'mt-1' }, inp(it.art, v => setItemG(key, idxs, 'art', v), 'Vertragsart')) : null,",[
          "    h('details', { className: 'mt-1' },",
          "      h('summary', { className: 'cursor-pointer select-none py-2 text-xs font-bold text-blue-700' }, 'Details & Einzelpreise bearbeiten', (!it.am || !it.am[0] || (key !== 'geraete' && !it.am[1])) ? h('span', { className: 'ml-2 text-amber-700' }, '· Preis prüfen') : null),",
          "      h('div', { className: 'pb-1' },",
          "    it.art ? h('div', { className: 'mt-1' }, inp(it.art, v => setItemG(key, idxs, 'art', v), 'Vertragsart')) : null,"
          ].join('\n'));
          once("style: { fontSize: 14, fontWeight: 500 } }));\n  };\n  const sBtn","style: { fontSize: 14, fontWeight: 500 } }))));\n  };\n  const sBtn");
          once("const sec = (title, n, stage, label, hideBtn, body, max) => h('div', { className: 'mt-3 rounded-xl border border-slate-200 p-3' },","const sec = (title, n, stage, label, hideBtn, body, max) => h('div', { className: 'mt-2 rounded-xl border border-slate-200 p-2.5' },");
          once("style: { maxWidth: 560, maxHeight: '94vh', overflowY: 'auto' }","style: { maxWidth: 700, maxHeight: '94vh', overflowY: 'auto' }");
          once("sec('HANDY', d.geraete.length",[
          "any ? h('div', { className: 'mt-3 grid grid-cols-2 gap-2 rounded-xl bg-[#0b1e42] p-3 text-white' },",
          "         [['Einmalig', d.einmalig], ['Monatlich', d.monatlich]].map(([lbl, val]) => h('div', { key: lbl, className: 'min-w-0' }, h('div', { className: 'text-xs font-bold text-blue-100' }, lbl + ' gesamt'), h('div', { className: 'text-xl font-black tabular-nums' }, val ? val + ' €' : 'Offen')))) : null,",
          "      sec('HANDY', d.geraete.length"].join('\n'));
          assert.equal(s.split('Aktionskarte').length,orig.split('Aktionskarte').length);
          const start=s.indexOf('  const item = (key, idxs, ph) => {');
          const end=s.indexOf('  const sBtn',start);
          assert.ok(start>=0 && end>start);
          const itemSource=s.slice(start,end);
          const h=(tag,props,...children)=>({tag,props:props||{},children:children.flat(Infinity)});
          const all=(node,tag)=>node&&typeof node==='object'?[...(node.tag===tag?[node]:[]),...node.children.flatMap(c=>all(c,tag))]:[];
          let calls=[];
          const d={tarife:[{name:'Tarif A',am:['0,00','20,00']},{name:'Tarif B',am:['0,00','10,00']}],geraete:[],internet:[]};
          const item=new Function('h','d','inp','setItemG','dupItem','delItem','PS_O2_MAX','psO2AkGb','psO2Fmt','money',itemSource+'\nreturn item;')(h,d,()=>h('input'),(...a)=>calls.push(a),()=>{},()=>{},{tarife:10},()=>'',x=>x,x=>x);
          for(let i=0;i<2;i++){const row=item('tarife',[i],'Tarif'); const btn=all(row,'button').find(x=>x.children.includes('Aktionskarte'));assert.ok(btn);btn.props.onClick();assert.equal(all(row,'details').length,1);}
          assert.deepEqual(calls,[['tarife',[0],'ak',true],['tarife',[1],'ak',true]]);
          assert.ok(!all(item('tarife',[0],'Tarif'),'details')[0].props.open);
          d.tarife.pop();assert.ok(!all(item('tarife',[0],'Tarif'),'button').some(x=>x.children.includes('Aktionskarte')));
          const summary=s.slice(s.indexOf("any ? h('div', { className: 'mt-3 grid grid-cols-2 gap-2 rounded-xl bg-[#0b1e42]"),s.indexOf("sec('HANDY', d.geraete.length")).trim().replace(/,$/,'');
          new Function('any','h','d','return '+summary)(true,h,{einmalig:'0,00',monatlich:'30,00'});
          fs.writeFileSync(path,s.replace(/\n/g,nl));
          console.log('UI patch and isolated React element tests passed');
          
          PATCH
      - name: Commit verified UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "v56.0-beta.2: compact OCR offer editor, totals and action card"
          git push origin HEAD:main
