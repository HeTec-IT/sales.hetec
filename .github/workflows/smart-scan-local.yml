name: PS Smart Scan 2 local beta
on:
  push:
    branches: [smart-scan-2-local]
    paths:
      - 'ocr/**'
      - 'scripts/patch-smart-scan.cjs'
      - 'scripts/test-smart-scan.mjs'
      - '.github/workflows/smart-scan-local.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted HTML patch
        run: node scripts/patch-smart-scan.cjs
      - name: Run OCR unit and regression tests
        run: node --test tests/ocr/*.test.mjs scripts/test-smart-scan.mjs
      - name: Build same-origin offline neural OCR assets
        working-directory: ocr
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit generated files to beta branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js ocr/generated ocr/package-lock.json
          git diff --cached --quiet || git commit -m "feat(smart-scan): apply local OCR beta and bundle static models"
          git push origin HEAD:smart-scan-2-local
